name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc, os: ubuntu-latest, cxx: g++, sanitize: "OFF" }
          - { name: clang, os: ubuntu-latest, cxx: clang++, sanitize: "OFF" }
          - { name: gcc-asan-ubsan, os: ubuntu-latest, cxx: g++, sanitize: "ON" }
          - { name: msvc, os: windows-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DKVLITE_SANITIZE=${{ matrix.sanitize }}
          -DCMAKE_CXX_FLAGS=-Werror

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure
